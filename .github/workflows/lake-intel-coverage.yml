name: Refresh Lake Intel coverage
on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lake-intel-coverage
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch lake-specific coverage
        run: python3 scripts/refresh_lake_intel.py
      - name: Publish changed coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lake-intel-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh automated Lake Intel coverage"
            git push
          fi
